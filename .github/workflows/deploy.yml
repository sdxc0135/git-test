name: Deploy Worker

on:
  push:
    branches: [ dev ]      # dev 커밋 → DEV 배포
    tags: [ 'v*' ]         # 태그 → PROD 배포
  workflow_dispatch: {}    # 수동 실행 버튼

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 필수 시크릿 존재만 체크(값은 출력 안 함)
      - name: Check required secrets exist
        run: |
          test -n "${{ secrets.CF_API_TOKEN }}" || (echo "Missing CF_API_TOKEN" && exit 1)
          test -n "${{ secrets.CF_ACCOUNT_ID }}" || (echo "Missing CF_ACCOUNT_ID" && exit 1)

      # (의존성 없으면 이 단계 통째로 지워도 됨)
      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      # 인증 먼저 확인 (여기서 통과해야 다음 단계로 진행)
      - name: Wrangler whoami (auth check)
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: '4.32.0'
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: whoami

      # DEV 배포
      - name: Deploy DEV
        if: startsWith(github.ref, 'refs/heads/dev')
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: '4.32.0'
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy --env dev

      # PROD 배포(태그)
      - name: Deploy PROD
        if: startsWith(github.ref, 'refs/tags/v')
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: '4.32.0'
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy --env prod

      # 실패 시 wrangler 로그 출력(원인 바로 확인)
      - name: Print wrangler logs
        if: failure()
        run: cat ~/.config/.wrangler/logs/*.log || true