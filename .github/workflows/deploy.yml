name: Deploy Worker

on:
  push:
    branches: [ dev ]
    tags: [ 'v*' ]
  workflow_dispatch: {}   # 수동 실행 버튼

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 0) wrangler 인증 점검
      - name: Wrangler whoami (auth check)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: '4.32.0'
          command: whoami --verbose

      # 1) (필요 시) 의존성 설치 — 없으면 이 단계 삭제 가능
      - name: Install deps
        run: npm ci

      # 2) DEV 배포 (먼저 최소 설정으로 테스트)
      - name: Deploy DEV (minimal)
        if: startsWith(github.ref, 'refs/heads/dev')
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: '4.32.0'
          command: deploy --env dev --verbose

      # 3) PROD 배포
      - name: Deploy PROD (minimal)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: '4.32.0'
          command: deploy --env prod --verbose